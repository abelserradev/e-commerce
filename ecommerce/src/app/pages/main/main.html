<section class="slider-section">
    <div class="slider">
        @for (image of images; track $index) {
            <div [class.active]="$index === currentIndex" class="slide">
                <img src="image.url" class="slide-image">
                <div class="slide-content">
                    <h1 class="slide-title" [innerHTML]="image.title"></h1>
                    <button class="btn btn-buy">Solicitar</button>
                </div>
            </div>
        }
    </div>
</section>
